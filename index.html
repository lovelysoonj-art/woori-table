function fmt(n){return Math.round(n).toLocaleString('ko-KR');}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

/* --- 계산 (순수 함수: 상태만으로 산출) --- */
function invSum(st){return st.inv.reduce(function(a,x){return a+x.price;},0);}
function ownedSum(st){return st.inv.filter(function(x){return x.owned;}).reduce(function(a,x){return a+x.price;},0);}
function soldOutSum(st){return st.inv.filter(function(x){return !x.owned;}).reduce(function(a,x){return a+x.price;},0);}
function mealCostSum(st){return st.meals.filter(function(m){return m.done;}).reduce(function(a,m){return a+m.cost;},0);}
function consumedCost(st){return mealCostSum(st)+soldOutSum(st);}
function remainingStock(st){return ownedSum(st)-mealCostSum(st);}
function ledgerTotal(st){return st.ledger.reduce(function(a,e){return a+e.amount*e.qty;},0);}
function ledgerOnline(st){return st.ledger.filter(function(e){return e.online;}).reduce(function(a,e){return a+e.amount*e.qty;},0);}
function catSums(st){var m={};CATS.forEach(function(c){m[c]=0;});st.ledger.forEach(function(e){var k=CATS.indexOf(e.cat)>=0?e.cat:'기타';m[k]+=e.amount*e.qty;});return m;}
function doneMeals(st){return st.meals.filter(function(m){return m.done;}).length;}
function planMeals(st){return st.meals.length;}

    '<div class="card"><div class="lhead">장볼 목록 <span class="dim">· 남은 '+left+'개</span></div>'
    +(S.list.map(listRowHTML).join('')||'<div class="empty">목록이 비었어요</div>')
    +'<div class="addform"><div class="frow"><input class="in" id="liName" placeholder="살 것 추가 (예: 두유)"><select class="in" id="liStore" style="flex:0 0 108px;width:108px">'+STORES.map(function(s){return '<option>'+s+'</option>';}).join('')+'</select></div>'
    +'<div class="frow"><input class="in" id="liMemo" placeholder="메모 (예: 시리얼용 · 필수)"><button class="btn primary" data-act="addList" style="flex:0 0 auto;width:auto;padding-left:20px;padding-right:20px">추가</button></div></div></div>'
    +'<button class="bigcopy" data-act="copyBasket">🛒 토비에게 장바구니 담기 요청 복사</button>';
}
function entryRowHTML(e){
  return '<div class="lrow"><div class="lcol"><b>'+esc(e.item)+'</b><i>'+esc(e.date)+' · '+esc(e.store)+' · '+esc(e.cat)+(e.qty>1?' · '+e.qty+'개':'')+'</i></div><b class="lamt">'+won(e.amount*e.qty)+'</b><button class="del" data-act="delLedger" data-id="'+e.id+'" aria-label="삭제">×</button></div>';
}
function renderLedger(){
  var lt=ledgerTotal(S),on=ledgerOnline(S),off=lt-on,p=planMeals(S),d=doneMeals(S),cons=consumedCost(S),rem=remainingStock(S);
  var per1=p?lt/p:0, per2=d?cons/d:0;
  var entries=S.ledger.slice().reverse();
  document.getElementById('ledgerBody').innerHTML=
    '<div class="card"><small class="cardcap">이번 주 지표 (11/16 - 11/22 · 성인 2 + 초등 1, 3인 기준)</small>'
    +'<div class="hero"><small>총 구매비용</small><b>'+won(lt)+'</b><i>온라인 '+won(on)+' + 오프라인 '+won(off)+'</i></div>'
    +'<div class="stat2"><div class="stbox"><small>소진비용</small><b>'+won(cons)+'</b><i>냉장고에 남은 재고<br>'+won(rem)+'</i></div>'
    +'<div class="stbox"><small>평균식대 · 끼니당</small><b>'+won(per1)+'</b><i>총 구매비용 ÷ 계획 '+p+'끼<br>1인당 '+won(per1/3)+'</i></div></div>'
    +'<div class="stbox wide"><small>평균식대 · 실제 소진</small><b>'+won(per2)+'</b><i>소진비용 ÷ 완료 '+d+'끼 · 1인당 '+won(per2/3)+'</i></div></div>'
    +'<div class="card"><div class="lhead">✍️ 장보기 추가 <span class="dim">오프라인·공동구매·온라인</span></div>'
    +'<div class="frow2"><input class="in" type="date" id="lDate" value="'+todayISO()+'"><input class="in" id="lStore" placeholder="구매처 (예: 동네마트)" list="storeList"><datalist id="storeList">'+QUICK_STORES.map(function(s){return '<option value="'+s+'"></option>';}).join('')+'</datalist></div>'
    +'<div class="chips">'+QUICK_STORES.map(function(s){return '<button class="chip" data-act="setStore" data-id="'+s+'">'+s+'</button>';}).join('')+'</div>'
    +'<input class="in" id="lItem" placeholder="품목명 (예: 양파 3망)" style="margin-bottom:8px">'
    +'<div class="frow3"><select class="in" id="lCat">'+CATS.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select><input class="in" id="lAmt" type="number" inputmode="numeric" placeholder="금액(원)"><input class="in" id="lQty" type="number" inputmode="numeric" value="1"></div>'
    +'<label class="mergelabel"><input type="checkbox" id="lMerge" checked> 냉장고에 같은 이름의 재료가 있으면 새로 추가하지 않기</label>'
    +'<button class="btn primary" data-act="addLedger">＋ 가계부에 추가</button>'
    +'<div class="ledgerlist">'+(entries.map(entryRowHTML).join('')||'<div class="empty">아직 기록이 없어요</div>')+'</div></div>';
}
function orderCardHTML(o){
  return '<div class="card">'
    +'<div class="otop"><b>'+esc(o.name)+'</b><span class="badge olive">'+esc(o.badge)+'</span></div>'
    +'<div class="dim small">'+esc(o.sub)+'</div>'
    +'<hr class="dash">'
    +'<div class="orow"><span>상품 금액 ('+o.items+'건)</span><b>'+won(o.goods)+'</b></div>'
    +'<div class="orow"><span>상품 할인</span><b class="good">-'+won(o.discount)+'</b></div>'
    +(o.points?'<div class="orow"><span>포인트·지원금</span><b class="good">-'+won(o.points)+'</b></div>':'')
    +'<hr class="dash">'
    +'<div class="orow pay"><span>실결제 금액<div class="dim small" style="font-weight:600">'+esc(o.pay)+'</div></span><b>'+won(o.paid)+'</b></div>'
    +'<hr class="dash">'
    +(o.card?'<div class="orow"><span>카드 7% 청구할인 (예상)</span><b class="good">-'+won(o.card)+'</b></div><div class="orow"><span>쏙7클럽 + 신세계포인트 적립 (예정)</span><b class="good">-'+won(o.save)+'</b></div>':'')
    +'<div class="final"><span>혜택까지 계산한 실지출</span><b>'+won(o.final)+'</b></div>'
    +'</div>';
}
function renderSummary(){
  var cs=catSums(S);
  var keys=Object.keys(cs).filter(function(k){return cs[k]>0;}).sort(function(a,b){return cs[b]-cs[a];});
  var max=keys.length?cs[keys[0]]:1;
  var bars=keys.map(function(k){
    return '<div class="brow"><span class="blabel">'+k+'</span><div class="bbar"><i style="width:'+Math.round(cs[k]/max*100)+'%;background:'+CAT_COLORS[k]+'"></i></div><b class="bval">'+won(cs[k])+'</b></div>';
  }).join('');
  document.getElementById('summaryBody').innerHTML=S.orders.map(orderCardHTML).join('')
    +'<div class="card"><div class="lhead">품목별 금액</div><div class="dim small" style="margin-bottom:6px">'+keys.length+'개 분류 · '+S.inv.length+'개 품목 · 합계 '+won(ledgerTotal(S))+'</div>'+bars+'</div>'
    +'<div class="note">💾 체크·입력 내용은 이 기기에 자동 저장돼요 (사파리로 열어 사용 기준).<br>처음 상태로 돌리려면 우측 상단 ↺ 초기화 버튼.</div>';
}
function renderAll(){renderMeals();renderInv();renderList();renderLedger();renderSummary();}

/* --- 모달·토스트 --- */
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
var toastTimer=null;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2200);}

/* --- 동작 --- */
function switchTab(t){
  tab=t;
  ['meals','inv','list','ledger','summary'].forEach(function(n){
    var sec=document.getElementById('tab-'+n);if(sec)sec.classList.toggle('active',n===t);
    var b=document.getElementById('tabbtn-'+n);if(b)b.classList.toggle('active',n===t);
  });
  window.scrollTo(0,0);
}
function toggleMeal(id){var m=S.meals.find(function(x){return x.id===id;});if(!m)return;m.done=!m.done;save();renderAll();}
function editMeal(id){
  var m=S.meals.find(function(x){return x.id===id;});if(!m)return;
  openModal('<h3>메뉴 수정 · '+DAYS[m.day][0]+' '+(m.slot==='am'?'아침':'저녁')+'</h3>'
    +'<input class="in" id="mealMenu" value="'+esc(m.menu)+'">'
    +'<input class="in" id="mealCost" type="number" inputmode="numeric" value="'+m.cost+'">'
    +'<p class="dim small">재료비를 고치면 소진비용·끼니당 식대에 그대로 반영돼요.</p>'
    +'<div class="mrow"><button class="btn ghost" data-act="closeModal">취소</button><button class="btn primary" data-act="saveMeal" data-id="'+m.id+'">저장</button></div>');
}
function saveMeal(id){
  var m=S.meals.find(function(x){return x.id===id;});if(!m)return;
  var v=document.getElementById('mealMenu').value.trim();
  var c=parseFloat(document.getElementById('mealCost').value);
  if(v)m.menu=v;
  if(!isNaN(c)&&c>=0)m.cost=Math.round(c);
  save();closeModal();renderAll();toast('메뉴를 수정했어요 ✏️');
}
function toggleInv(id){var x=S.inv.find(function(y){return y.id===id;});if(!x)return;x.owned=!x.owned;save();renderAll();}
function starInv(id){var x=S.inv.find(function(y){return y.id===id;});if(!x)return;x.star=!x.star;save();renderInv();}
function setInvFilter(c){invFilter=c;renderInv();}
function starList(id){var x=S.list.find(function(y){return y.id===id;});if(!x)return;x.star=!x.star;save();renderList();}
function checkList(id){var x=S.list.find(function(y){return y.id===id;});if(!x)return;x.done=!x.done;save();renderList();}
function delList(id){S.list=S.list.filter(function(y){return y.id!==id;});save();renderList();toast('삭제했어요');}
function delLedger(id){S.ledger=S.ledger.filter(function(y){return y.id!==id;});save();renderAll();toast('기록을 삭제했어요');}
function addList(){
  var v=document.getElementById('liName').value.trim();
  if(!v){toast('품목명을 입력해 주세요');return;}
  S.list.push({id:uid(),name:v,memo:document.getElementById('liMemo').value.trim(),store:document.getElementById('liStore').value,star:false,done:false});
  save();renderList();toast('장볼 목록에 추가했어요 🛒');
}
function basketText(){
  var left=S.list.filter(function(x){return !x.done;});
  if(!left.length)return null;
  var groups={};STORES.forEach(function(s){groups[s]=[];});
  left.forEach(function(x){(groups[x.store]||groups['기타']).push(x);});
  var t='🛒 토비에게 장바구니 담기 요청\n\n아래 품목을 장바구니에 담아 주세요!\n';
  STORES.forEach(function(s){
    if(groups[s].length){t+='\n['+s+']\n';groups[s].forEach(function(x){t+='· '+x.name+(x.memo?' — '+x.memo:'')+'\n';});}
  });
  return t;
}
function copyBasket(){
  var t=basketText();
  if(!t){toast('남은 품목이 없어요 🎉');return;}
  var ok=function(){toast('복사 완료! 토비 채팅창에 붙여넣어 주세요 🛒');};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok,function(){fallbackCopy(t);});
  }else{fallbackCopy(t);}
}
function fallbackCopy(t){
  openModal('<h3>복사할 요청 문구</h3><textarea id="copyText" readonly>'+esc(t)+'</textarea>'
    +'<div class="mrow"><button class="btn ghost" data-act="closeModal">닫기</button><button class="btn primary" data-act="copySel">복사</button></div>');
}
function copySel(){
  var ta=document.getElementById('copyText');
  ta.focus();ta.select();
  try{document.execCommand('copy');closeModal();toast('복사 완료! 토비 채팅창에 붙여넣어 주세요 🛒');}
  catch(e){toast('길게 눌러 직접 복사해 주세요');}
}
function setStore(s){document.getElementById('lStore').value=s;}
function addLedger(){
  var item=document.getElementById('lItem').value.trim();
  var amt=parseFloat(document.getElementById('lAmt').value);
  if(!item){toast('품목명을 입력해 주세요');return;}
  if(isNaN(amt)||amt<=0){toast('금액을 입력해 주세요');return;}
  var qty=Math.max(1,Math.round(parseFloat(document.getElementById('lQty').value)||1));
  var cat=document.getElementById('lCat').value;
  var e={id:uid(),date:document.getElementById('lDate').value||todayISO(),store:document.getElementById('lStore').value.trim()||'기타',item:item,cat:cat,amount:Math.round(amt),qty:qty,online:true};
  S.ledger.push(e);
  if(!document.getElementById('lMerge').checked){
    S.inv.push({id:uid(),name:item,spec:'',price:Math.round(amt/qty),cat:CATS.indexOf(cat)>=0?cat:'기타',star:false,owned:true});
  }
  save();renderAll();toast('가계부에 추가했어요 ✓');
}
function askReset(){
  openModal('<h3>처음 상태로 되돌릴까요?</h3><p class="dim">지금까지 체크·수정·입력한 내용이 모두 지워지고 기본 샘플 상태로 돌아갑니다.</p>'
    +'<div class="mrow"><button class="btn ghost" data-act="closeModal">취소</button><button class="btn terra" data-act="doReset">초기화</button></div>');
}
function doReset(){
  try{localStorage.removeItem(KEY);}catch(e){}
  S=JSON.parse(JSON.stringify(SEED));invFilter='전체';invQuery='';closeModal();renderAll();toast('초기화했어요 ↺');
}

var ACTIONS={
  switchTab:switchTab,toggleMeal:toggleMeal,editMeal:editMeal,saveMeal:saveMeal,
  toggleInv:toggleInv,starInv:starInv,setInvFilter:setInvFilter,
  starList:starList,checkList:checkList,delList:delList,addList:addList,
  copyBasket:copyBasket,copySel:copySel,addLedger:addLedger,delLedger:delLedger,
  setStore:setStore,askReset:askReset,doReset:doReset,closeModal:closeModal
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(ACTIONS[act])ACTIONS[act](id,el);
});

S=load();
renderAll();
switchTab('meals');
</script>
</body>
</html>
